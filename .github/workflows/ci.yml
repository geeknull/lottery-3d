name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 支持在 Actions 页面手动触发部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR 连续 push 时取消上一次未跑完的 run；main 推送不取消，避免打断部署链路
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 需完整历史算 push 范围与提交数
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # 按本次 push 的提交生成 release-notes.json，随 dist 部署（不 commit 回仓、不打 tag）
      - run: node scripts/gen-release-notes.mjs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
      # build 内含 tsc --noEmit，顺带类型检查；放在 E2E 前先拦类型/构建错误
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm e2e:pwa
      # 仅在有步骤失败时上传 E2E 报告（含 trace）便于排查；全绿时不留无用产物
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore  # 若失败发生在 E2E 之前（无报告），静默跳过不告警
      # 仅 main 推送 / 手动触发时上传部署产物；PR 不部署
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.event_name != 'pull_request' }}
        with:
          path: dist

  deploy:
    # 只有非 PR（main 推送或手动触发）且 verify 全绿才部署
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    # 部署串行化，避免并发部署互相打断
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
